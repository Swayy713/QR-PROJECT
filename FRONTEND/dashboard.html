<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AuthChain</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="manufacturer.css">
    <style>
        .dashboard-container {
            max-width: 800px;
            width: 100%;
            margin-top: 40px;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }
        .user-info {
            text-align: left;
        }
        .user-info h1 {
            font-size: 24px;
            margin-bottom: 5px;
            background: none;
            -webkit-text-fill-color: initial;
            color: #ffffff;
        }
        .user-info p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 0;
            font-weight: 400;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-logout {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }
        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .btn-new-product {
            background: #387aff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            display: inline-block;
            font-size: 14px;
        }
        .btn-new-product:hover {
            background: #2b61cc;
            box-shadow: 0 4px 15px rgba(56, 122, 255, 0.3);
            color: white;
        }
        
        .product-grid {
            display: grid;
            gap: 16px;
            text-align: left;
            margin-bottom: 40px;
        }
        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, border-color 0.3s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .product-info h3 {
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: 600;
        }
        .product-info p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }
        .product-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #00c9a7;
            font-size: 13px;
            font-weight: 500;
            background: rgba(0, 201, 167, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .section-title {
            text-align: left;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            color: white;
        }

        @media (max-width: 600px) {
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .product-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container dashboard-container">
        
        <div class="dashboard-header">
            <div class="user-info">
                <h1 id="welcomeUser">Welcome, Manufacturer</h1>
                <p id="userEmail">Loading...</p>
            </div>
            <div class="header-actions">
                <a href="manufacturer.html" class="btn-new-product">+ Register New Product</a>
                <button class="btn-logout" onclick="logout()">Log Out</button>
            </div>
        </div>

        <h2 class="section-title">Your Registered Products</h2>

        <div class="product-grid" id="productList">
            <div class="empty-state">Loading your products...</div>
        </div>
        
    </div>

    <script src="dashboard.js"></script>

</body>
</html>
