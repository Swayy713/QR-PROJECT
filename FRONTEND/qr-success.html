<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Ready</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .card {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 40px 36px;
            text-align: center;
            width: 360px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .success-badge {
            font-size: 48px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 6px;
            color: #00c9a7;
        }

        .product-id {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 28px;
            word-break: break-all;
        }

        .qr-wrapper {
            background: white;
            display: inline-block;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 28px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }

        .btn-download {
            background: #00c9a7;
            color: white;
        }

        .btn-new {
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .btn-home {
            background: transparent;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="success-badge">✅</div>
    <h1>Product Registered!</h1>
    <p class="product-id" id="productIdDisplay"></p>

    <div class="qr-wrapper">
        <canvas id="qrCanvas"></canvas>
    </div>

    <button class="btn btn-download" id="downloadBtn">⬇ Download QR Code</button>
    <button class="btn btn-new" onclick="window.location.href='manufacturer.html'">+ Register Another Product</button>
    <button class="btn btn-home" onclick="window.location.href='index.html'">← Back to Home</button>
</div>

<!-- qrious: lightweight canvas-based QR library, no dependencies -->
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
    // Read productId from URL query params: qr-success.html?productId=XXX
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("productId");

    if (!productId) {
        // Nothing to show — go back
        window.location.href = "manufacturer.html";
    } else {
        document.getElementById("productIdDisplay").textContent = "Product ID: " + productId;

        const qr = new QRious({
            element: document.getElementById("qrCanvas"),
            value: productId,
            size: 220,
            level: "H",          // High error correction
            background: "white",
            foreground: "black",
        });

        document.getElementById("downloadBtn").addEventListener("click", () => {
            const canvas = document.getElementById("qrCanvas");
            const link = document.createElement("a");
            link.download = "QR-" + productId + ".png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>

</body>
</html>
