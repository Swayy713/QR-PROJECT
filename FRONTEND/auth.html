<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manufacturer Auth | AuthChain</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="manufacturer.css">
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 14px;
        }
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .tab-btn.active {
            background: #387aff;
            box-shadow: 0 4px 15px rgba(56, 122, 255, 0.3);
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="pageTitle">Manufacturer Sign In</h1>
            <p class="subtitle">Access your product dashboard</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Log In</button>
            <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Register</button>
        </div>

        <form id="loginForm" class="form-section active" onsubmit="return false;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="e.g. hello@authcorp.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            <button type="button" id="loginBtn" class="btn-submit">Sign In</button>
        </form>

        <form id="registerForm" class="form-section" onsubmit="return false;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="e.g. AuthCorp" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regFullName" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="e.g. hello@authcorp.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Create a password" required>
            </div>
            <button type="button" id="regBtn" class="btn-submit">Create Account</button>
        </form>

        <div id="message" style="margin-top:20px; text-align:center;"></div>

        <a href="index.html" class="back-link" style="margin-top:24px;">← Return Home</a>
    </div>

    <script src="auth.js"></script>

</body>
</html>
